[build-system]
requires = ["setuptools>=68.0.0", "wheel", "pytest-asyncio>=0.24.0"]
build-backend = "setuptools.build_meta"

[project]
name = "em-cubed"
version = "0.1.0"
description = "Polyglot AI Skill Engine & Neuro-Symbolic OS"
authors = [{name = "Em-Cubed Authors"}]
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "types-PyYAML",
  "pygls",
  "lsprotocol",
]

[tool.ruff.lint]
ignore = [
  "BLE001",  # intentional blind exceptions with nosec B110
  "S110",    # intentional try-except-pass with nosec B110
  "RUF012",  # intentional mutable class-level defaults
  "PLW0602", # intentional global accessor pattern
]
