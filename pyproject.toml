[build-system]
requires = ["setuptools>=68.0.0", "wheel", "pytest-asyncio>=0.24.0"]
build-backend = "setuptools.build_meta"

[project]
name = "em-cubed"
version = "0.1.0"
description = "Polyglot AI Skill Engine & Neuro-Symbolic OS"
authors = [{name = "Em-Cubed Authors"}]
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "structlog>=23.0.0",
  "numpy>=1.20.0",
  "PyYAML>=6.0.1",
  "asteval>=1.0.0",
  "fastapi>=0.110.0,<1.0.0",
  "pydantic>=2.5.0,<3.0.0",
  "jinja2>=3.0.0",
  "jsonschema>=4.0.0",
  "whoosh>=2.7.4,<3.0.0",
  "requests>=2.28.0",
  "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
  "structlog>=23.0.0",
  "numpy>=1.20.0",
  "ruff",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-xdist",
  "pytest-timeout",
  "hypothesis",
  "python-dotenv",
  "types-PyYAML",
  "pygls",
  "lsprotocol",
  "litellm",
]

[tool.ruff.lint]
ignore = [
  "BLE001",  # intentional blind exceptions with nosec B110
  "S110",    # intentional try-except-pass with nosec B110
  "RUF012",  # intentional mutable class-level defaults
  "PLW0602", # intentional global accessor pattern
]

[tool.pytest.ini_options]
timeout = 30
timeout_method = "thread"
asyncio_mode = "auto"
testpaths = ["tests"]


