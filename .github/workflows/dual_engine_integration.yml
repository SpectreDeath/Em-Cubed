name: Dual-Engine Integration CI/CD & Benchmarks

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install pyswip hy z3-solver pyDatalog || echo "Surface dependencies non-critical"

      - name: Run Ruff Lint Checks
        run: ruff check src/ tests/

      - name: Run Pytest Test Suite
        run: pytest -q --cov=em_cubed --cov-report=term-missing --cov-fail-under=50

      - name: Execute Dual-Engine Performance Benchmark
        run: python -c "from em_cubed.benchmarks import DualEngineBenchmarkRunner; rep = DualEngineBenchmarkRunner.run_benchmark(10); print('Benchmark Report:', rep.metrics_summary)"

