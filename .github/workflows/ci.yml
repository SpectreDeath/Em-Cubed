name: CI

on:
  push:
    branches: [ main, master, skills-library ]
  pull_request:
    branches: [ main, master, skills-library ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install SWI-Prolog
      run: sudo apt-get update && sudo apt-get install -y swi-prolog
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install structlog numpy fastapi pydantic PyYAML asteval jinja2 whoosh pytest-xdist litellm
        pip install pyswip hy z3-solver kanren clingo || true
        pip install pyDatalog || echo "pyDatalog non-critical"
    
    - name: Lint with ruff
      run: pip install ruff && ruff check src/ tests/
    
    - name: Type check with mypy
      run: pip install mypy && mypy --ignore-missing-imports src/em_cubed/

    - name: Security scan with bandit
      run: pip install bandit && bandit -r src/ -c pyproject.toml

    - name: Run tests
      env:
        PYTHONPATH: src:.
        EM_CUBED_TIMEOUT: 30.0
      run: |
        pytest -n auto --tb=short \
          --cov=em_cubed \
          --cov-report=term-missing \
          --cov-report=xml \
          --cov-fail-under=30

    - name: Execute Dual-Engine Performance Benchmark
      run: |
        python -c "from em_cubed.benchmarks import DualEngineBenchmarkRunner; rep = DualEngineBenchmarkRunner.run_benchmark(10); print('Benchmark Report:', rep.metrics_summary)"

    - name: Build package
      run: python -m pip install build && python -m build
