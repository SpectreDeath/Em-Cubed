name: Tri-Engine Integration Matrix

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Install SWI-Prolog
      run: sudo apt-get update && sudo apt-get install -y swi-prolog

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install pyswip hy z3-solver pyDatalog || echo "Surface dependencies non-critical"

    - name: Run Ruff Linter
      run: ruff check src/ tests/

    - name: Run Em-Cubed Master Test Suite
      run: pytest -q --cov=em_cubed --cov-fail-under=50

